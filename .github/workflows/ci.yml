name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CodeMX.sln
      - name: Build
        run: dotnet build CodeMX.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CodeMX.sln --configuration Release --no-build --verbosity normal
